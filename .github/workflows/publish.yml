name: publish

on:
  push:
    branches: [main]
    paths: ["plugins/**", "media/**", "schema/**", "scripts/**", "docs/**", "agent-skills/**", ".claude-plugin/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: finch-xu/cc-router
          path: .cc-router
          sparse-checkout: |
            src/plugins
            src/lib
            scripts/lib
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 系统插件 (厂商 / 计价 / 规则 / 通知) 的内容由 cc-router 的 Rust 检查器校验, 与 app 安装时同一份规则。
      # 只有目录里有这类条目时才编译它 (完整检出 cc-router, 只编 cc-router-plugin-spec 这个小 crate)。
      - name: need rust checker?
        id: rust
        run: |
          if [ -n "$(find plugins/provider plugins/pricing plugins/rules plugins/notifier -maxdepth 1 -name '*.json' 2>/dev/null)" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.rust.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: finch-xu/cc-router
          path: .cc-router-rust
      - if: steps.rust.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.rust.outputs.needed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .cc-router-rust/src-tauri
      - if: steps.rust.outputs.needed == 'true'
        name: build ccr-plugin-check
        run: |
          cargo build --release --locked --manifest-path .cc-router-rust/src-tauri/Cargo.toml -p cc-router-plugin-spec --bin ccr-plugin-check
          echo "CCR_PLUGIN_CHECK=$PWD/.cc-router-rust/src-tauri/target/release/ccr-plugin-check" >> "$GITHUB_ENV"
      - run: node scripts/check.mjs --write
      - name: commit index.json
        run: |
          if git diff --quiet -- index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: rebuild index.json"
          git push
