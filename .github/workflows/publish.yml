name: publish

on:
  push:
    branches: [main]
    paths: ["plugins/**", "media/**", "schema/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: finch-xu/cc-router
          path: .cc-router
          sparse-checkout: |
            src/plugins
            scripts/lib
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs --write
      - name: commit index.json
        run: |
          if git diff --quiet -- index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: rebuild index.json"
          git push
